[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veracia"
version = "0.1.0"
description = "A pluggable evaluation harness for LLM/ML output — one runner, one report format, per-project metric plugins."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
]

[tool.setuptools.packages.find]
include = ["veracia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
